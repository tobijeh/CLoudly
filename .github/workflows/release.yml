name: Release

# Every push to main builds a signed release APK and attaches it to a GitHub Release,
# so Obtainium (pointed at this repo) sees each build as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.CLOUDLY_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.CLOUDLY_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.CLOUDLY_KEY_ALIAS }}
          KP: ${{ secrets.CLOUDLY_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing CLOUDLY_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing CLOUDLY_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing CLOUDLY_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing CLOUDLY_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README.md > Release signing."
            exit 1
          fi

      - name: Decode keystore
        env:
          KS: ${{ secrets.CLOUDLY_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/cloudly-release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build signed release APK
        env:
          CLOUDLY_KEYSTORE_PATH: ${{ runner.temp }}/cloudly-release.jks
          CLOUDLY_KEYSTORE_PASSWORD: ${{ secrets.CLOUDLY_KEYSTORE_PASSWORD }}
          CLOUDLY_KEY_ALIAS: ${{ secrets.CLOUDLY_KEY_ALIAS }}
          CLOUDLY_KEY_PASSWORD: ${{ secrets.CLOUDLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --console=plain

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREFIX=$(grep '^cloudlyVersionPrefix=' gradle.properties | cut -d= -f2)
          VERSION="$PREFIX.${{ github.run_number }}"
          TAG="v$VERSION"
          APK="cloudly-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --title "Cloudly $VERSION" \
            --notes "Automated build of ${{ github.sha }}. Install or update with Obtainium, or download $APK directly." \
            --latest

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cloudly-release.jks"

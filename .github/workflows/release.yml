name: Release

# Every push to main builds a signed release APK and attaches it to a GitHub Release,
# so Obtainium (pointed at this repo) sees each build as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDLY_KEYSTORE_PASSWORD: cloudly-release
  CLOUDLY_KEY_ALIAS: cloudly
  CLOUDLY_KEY_PASSWORD: cloudly-release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Signing needs only ONE repository secret: CLOUDLY_KEYSTORE_BASE64 (the keystore file as base64 text).
      # The keystore password and alias are fixed below; the keystore file itself is what stays secret.
      - name: Decode keystore
        env:
          KS: ${{ secrets.CLOUDLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing repository secret CLOUDLY_KEYSTORE_BASE64. See README.md > Release signing."
            exit 1
          fi
          # Keep only base64 characters, so anything picked up when copying from a chat or editor
          # (code-fence backticks, smart quotes, invisible formatting, certutil BEGIN/END lines) is ignored.
          CLEAN=$(printf '%s' "$KS" | grep -v -- '-----' | tr -cd 'A-Za-z0-9+/=')
          echo "Secret length: ${#KS} characters, ${#CLEAN} after cleaning."
          printf '%s' "$CLEAN" | base64 --decode > "$RUNNER_TEMP/cloudly-release.jks" || {
            echo "::error::CLOUDLY_KEYSTORE_BASE64 is not valid base64 (${#CLEAN} usable characters). Paste the whole key again."
            exit 1
          }
          keytool -list -keystore "$RUNNER_TEMP/cloudly-release.jks" -storepass "$CLOUDLY_KEYSTORE_PASSWORD" -alias "$CLOUDLY_KEY_ALIAS" > /dev/null || {
            echo "::error::CLOUDLY_KEYSTORE_BASE64 decoded, but is not a Cloudly keystore (password 'cloudly-release', alias 'cloudly')."
            exit 1
          }

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build signed release APK
        env:
          CLOUDLY_KEYSTORE_PATH: ${{ runner.temp }}/cloudly-release.jks
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --console=plain

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREFIX=$(grep '^cloudlyVersionPrefix=' gradle.properties | cut -d= -f2)
          VERSION="$PREFIX.${{ github.run_number }}"
          TAG="v$VERSION"
          APK="cloudly-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --title "Cloudly $VERSION" \
            --notes "Automated build of ${{ github.sha }}. Install or update with Obtainium, or download $APK directly." \
            --latest

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cloudly-release.jks"
